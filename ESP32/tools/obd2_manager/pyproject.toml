[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obd2-manager"
version = "1.0.0"
description = "Desktop application for ESP32 OBD2 Smart Logger management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "OBD2 Data Acquisition Project"}
]
keywords = ["obd2", "can", "automotive", "esp32", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "PyQt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
]
dbc = [
    "cantools>=39.0",
]

[project.scripts]
obd2-manager = "obd2_manager.main:main"

[project.gui-scripts]
obd2-manager-gui = "obd2_manager.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["obd2_manager*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
