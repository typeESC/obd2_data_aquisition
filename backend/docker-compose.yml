version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: obd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-obd_logger}
      POSTGRES_USER: ${POSTGRES_USER:-obd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obd_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - obd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obd_user} -d ${POSTGRES_DB:-obd_logger}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: obd_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - obd_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obd_api
    restart: unless-stopped
    environment:
      # Database configuration
      POSTGRES_SERVER: db
      POSTGRES_DB: ${POSTGRES_DB:-obd_logger}
      POSTGRES_USER: ${POSTGRES_USER:-obd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obd_password}
      POSTGRES_PORT: 5432
      
      # Redis configuration
      REDIS_URL: redis://redis:6379/0
      
      # Application configuration
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      
      # CORS configuration
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
      
      # Alert thresholds
      HIGH_RPM_THRESHOLD: ${HIGH_RPM_THRESHOLD:-6000}
      HIGH_COOLANT_TEMP_THRESHOLD: ${HIGH_COOLANT_TEMP_THRESHOLD:-105}
      LOW_FUEL_THRESHOLD: ${LOW_FUEL_THRESHOLD:-10}
      LOW_VOLTAGE_THRESHOLD: ${LOW_VOLTAGE_THRESHOLD:-11.5}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro  # Mount for development (remove in production)
    networks:
      - obd_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: obd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@obd.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - obd_network
    depends_on:
      - db
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

  # Nginx (Optional - for production reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: obd_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates if needed
    networks:
      - obd_network
    depends_on:
      - api
    profiles:
      - production  # Only start with: docker-compose --profile production up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  obd_network:
    driver: bridge
